[build]
builder = "RAILPACK"
buildCommand = "/app/.venv/bin/python -m pip install . && /app/.venv/bin/python -m pip check && /app/.venv/bin/python -m uvicorn --version"

[deploy]
startCommand = "/app/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
